<script>
/* ==========================================================================
   StopShop — versione a file singolo, senza build e senza dipendenze.
   Stessa logica clinica, stesso motore di punteggio e stessi testi della
   versione React: qui tutto sta in una pagina che si apre e basta.
   ========================================================================== */

/* ---------- memoria locale ------------------------------------------- */
// Prova nell'ordine: storage dell'ambiente, localStorage, memoria volatile.
const Mem = (() => {
  const CHIAVE = 'stopshop'
  let volatile = null
  return {
    async leggi() {
      try {
        if (window.storage) {
          const r = await window.storage.get(CHIAVE)
          return r ? JSON.parse(r.value) : null
        }
      } catch (e) {}
      try {
        const v = localStorage.getItem(CHIAVE)
        return v ? JSON.parse(v) : null
      } catch (e) {}
      return volatile
    },
    async scrivi(dati) {
      volatile = dati
      const testo = JSON.stringify(dati)
      try {
        if (window.storage) return void (await window.storage.set(CHIAVE, testo))
      } catch (e) {}
      try {
        localStorage.setItem(CHIAVE, testo)
      } catch (e) {}
    },
  }
})()

/* ---------- contenuti -------------------------------------------------- */
const NOME = 'Fabio'
const PARTNER = 'Luciano'

const TRIGGER_ESTERNI = [
  ['notifica', 'Una notifica push'],
  ['email', 'Una e-mail o una newsletter'],
  ['sconto', 'Uno sconto lampo o un countdown'],
  ['algoritmo', 'Un consiglio dell’algoritmo'],
  ['social', 'Scrolling sui social'],
  ['pubblicita', 'Una pubblicità'],
  ['vetrina', 'L’ho visto in negozio'],
]
const TRIGGER_INTERNI = [
  ['ansia', 'Ansia'],
  ['noia', 'Noia'],
  ['tristezza', 'Tristezza'],
  ['rabbia', 'Rabbia'],
  ['stress', 'Stress'],
  ['stanchezza', 'Stanchezza'],
  ['solitudine', 'Solitudine'],
  ['premio', 'Voglia di premiarmi'],
]
const PRATICHE = ['Si è rotto qualcosa', 'Mi serve per un impegno preciso', 'L’ho pianificato da tempo']
const CATEGORIE = [
  ['tecnologia', 'Tecnologia'],
  ['abbigliamento', 'Abbigliamento'],
  ['casa', 'Casa'],
  ['hobby', 'Hobby'],
  ['curaDiSe', 'Cura di sé'],
  ['altro', 'Altro'],
]
const GIUSTIFICAZIONI = [
  ['offerta', '«È in offerta, quindi sto risparmiando»', 'Sto spendendo denaro che non avevo pianificato di usare, per un oggetto che non avevo previsto. Il risparmio su un acquisto non programmato è una motivazione fittizia: non riduce la spesa, la crea.'],
  ['merito', '«Me lo merito, è stata una giornata pesante»', 'La giornata pesante è reale, e il bisogno di sollievo è legittimo. L’oggetto però non alleggerisce la giornata: sposta la fatica di qualche ora. Il merito non si riscuote con un pagamento.'],
  ['scarsita', '«Se non lo prendo ora lo perdo»', 'La scarsità, online, è quasi sempre costruita: il countdown è un elemento di interfaccia, non un fatto. Se l’oggetto serve davvero, tornerà disponibile; se non tornasse, la perdita reale sarebbe piccola.'],
  ['investimento', '«È un investimento su me stesso»', 'Un investimento ha un rendimento che sai descrivere. Se non riesci a dire cosa produrrà nei prossimi tre mesi, è una spesa: chiamarla così non la rende peggiore, la rende visibile.'],
  ['uso', '«Tanto lo uso di sicuro»', 'È una previsione fatta nel momento di massima tensione, quando siamo tutti ottimisti. Il dato più affidabile non è la previsione: è quante volte hai usato l’ultimo oggetto simile che hai comprato.'],
  ['poco', '«Costa poco, non cambia niente»', 'Il costo singolo è basso, la frequenza no. Sono i piccoli importi ripetuti a formare la parte più grande della spesa non pianificata, e sono anche i più difficili da vedere.'],
]
const DOMANDE = [
  ['q1', 'Questo problema ti si è già presentato almeno tre volte nell’ultimo mese?'],
  ['q2', 'Possiedi già qualcosa che fa la stessa cosa, anche male?'],
  ['q3', 'Lo avresti cercato oggi anche senza quell’offerta o quella notifica?'],
  ['q4', 'Sai già dove lo terrai e quando lo userai la prima volta?'],
  ['q5', 'Lo compreresti a prezzo pieno fra un mese?'],
  ['q6', 'Questa spesa resta dentro il tuo budget libero del mese?'],
]
const ALTERNATIVE = {
  noia: 'Dieci minuti di una cosa che stai imparando. La dopamina della conoscenza dura più a lungo di quella del carrello.',
  ansia: 'Body scan di cinque minuti, guidato qui dentro.',
  stress: 'Una passeggiata di quindici minuti. Esci senza destinazione e senza telefono in mano.',
  tristezza: 'Parlane con ' + PARTNER + ' adesso, anche solo per due minuti.',
  solitudine: 'Parlane con ' + PARTNER + ' adesso, anche solo per due minuti.',
  rabbia: 'Scrivi qui cosa è successo, senza filtri. Nessuno lo leggerà.',
  stanchezza: 'Non ti manca un oggetto, ti manca il riposo. Dieci minuti sdraiato, telefono in un’altra stanza.',
  premio: 'Scegli un premio non commerciale dalla tua lista.',
}
const PREMI = ['Un bagno lungo, senza telefono', 'Un film scelto da te, senza fare altro', 'Una telefonata a una persona che ti manca', 'Un’ora di sonno in più']
const COMPITI = ['Controlla se possiedi già qualcosa che fa questo lavoro.', 'Trova due alternative e confronta il costo per uso.']
const CRITERI = [
  ['durabilita', 'Durabilità e materiali', 'Di cosa è fatto, quanto è dichiarata la vita utile.'],
  ['riparabilita', 'Riparabilità', 'Esistono ricambi? Si apre? C’è un indice di riparabilità?'],
  ['garanzia', 'Garanzia e assistenza', 'Durata, chi la eroga, centri assistenza in Italia.'],
  ['possesso', 'Costo totale di possesso', 'Prezzo + consumabili + manutenzione su cinque anni.'],
  ['costoPerUso', 'Costo per uso', 'Calcolato in automatico sulla vita utile stimata.'],
  ['recensioni', 'Recensioni indipendenti', 'Almeno una fonte che non sia il venditore.'],
  ['reso', 'Reso e diritto di recesso', 'Quanti giorni, chi paga la spedizione di ritorno.'],
  ['ingombro', 'Compatibilità e ingombro', 'Misure verificate, spazio reale in casa.'],
]
const FRASI_SOS = [
  'Sei nell’occhio del ciclone. Tutto gira, tu stai fermo.',
  'Questa tensione ha già raggiunto il picco. Da qui scende.',
  'Non devi decidere adesso. Devi solo restare.',
]
const BODY_SCAN = [
  'Appoggia l’attenzione sui piedi. Non devi cambiare niente: solo notare.',
  'Sali alle gambe. Peso, contatto, temperatura.',
  'Bacino e schiena bassa. Dove tocchi la sedia o il letto.',
  'Pancia. Lasciala andare, senza tirarla.',
  'Petto. Segui una sola inspirazione fino in fondo.',
  'Mani. Palmi, dita, punta delle dita.',
  'Braccia e spalle. Se sono alte, lasciale scendere di un centimetro.',
  'Gola e mascella. La mascella quasi sempre è stretta.',
  'Viso. Fronte, occhi, sopracciglia.',
  'Tutto il corpo insieme, per un ultimo respiro.',
]
const TITOLI = { impulso: 'Questo è un impulso.', zonaGrigia: 'Zona grigia.', necessita: 'Qui c’è una necessità reale.' }
const ORE_ATTESA = { impulso: 72, zonaGrigia: 48, necessita: 24 }

/* ---------- tempo ------------------------------------------------------ */
const ORA_MS = 3600000
const due = (n) => String(Math.floor(n)).padStart(2, '0')
const fraOre = (ore) => new Date(Date.now() + ore * ORA_MS).toISOString()
const rimasti = (iso) => Math.max(0, new Date(iso).getTime() - Date.now())
const countdown = (ms) => { const s = Math.floor(ms / 1000); return due(s / 3600) + ':' + due((s % 3600) / 60) + ':' + due(s % 60) }
const countdownBreve = (ms) => { const s = Math.floor(ms / 1000); return due(s / 3600) + ':' + due((s % 3600) / 60) }
const oreResidue = (ms) => Math.ceil(ms / ORA_MS)
const dataOra = (iso) => new Date(iso).toLocaleString('it-IT', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })
const nuovoId = () => 's-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8)
const euro = (n) => new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: n < 10 ? 2 : 0 }).format(n || 0)
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

/* ---------- motore di punteggio (§5) ----------------------------------- */
const etichettaInterno = (id) => (TRIGGER_INTERNI.find((t) => t[0] === id) || [, id])[1].toLowerCase()
const etichettaEsterno = (id) => (TRIGGER_ESTERNI.find((t) => t[0] === id) || [, id])[1].toLowerCase()
const elenco = (v) => (v.length <= 1 ? v.join('') : v.slice(0, -1).join(', ') + ' e ' + v[v.length - 1])

function calcolaPunteggio(d) {
  const segnali = []
  const agg = (id, delta, testo) => { if (delta !== 0) segnali.push({ id, delta, testo }) }
  const r = d.risposteNecessita
  const usi = Math.max(0, d.usiPrevisti12Mesi)
  const cpu = usi > 0 ? d.prezzo / usi : null

  if (r.q1 === true) agg('q1', 20, 'Il problema si ripresenta: te lo sei trovato davanti più volte nell’ultimo mese.')
  if (r.q2 === false) agg('q2', 15, 'Non hai già in casa qualcosa che faccia questo lavoro.')
  if (r.q3 === true) agg('q3', 20, 'Lo avresti cercato lo stesso, anche senza quell’offerta.')
  if (r.q4 === true) agg('q4', 10, 'Sai già dove lo terrai e quando lo userai la prima volta.')
  if (r.q5 === true) agg('q5', 15, 'Lo compreresti a prezzo pieno anche fra un mese.')
  if (r.q6 === true) agg('q6', 10, 'La spesa resta dentro il tuo budget libero del mese.')
  if (d.necessitaPratica) agg('pratica', 15, 'La spinta arriva da una necessità pratica, non da uno stato emotivo.')
  if (cpu !== null && cpu < 1) agg('cpu', 10, 'Costo per uso basso: ' + euro(cpu) + ' a utilizzo.')
  else if (cpu !== null && cpu <= 5) agg('cpu', 5, 'Costo per uso contenuto: ' + euro(cpu) + ' a utilizzo.')

  if (r.q2 === true) agg('q2', -20, 'Hai già qualcosa che fa questo lavoro, anche male.')
  if (r.q3 === false) agg('q3', -20, 'Senza quell’offerta o quella notifica non lo avresti cercato oggi.')
  if (r.q5 === false) agg('q5', -20, 'A prezzo pieno, fra un mese, non lo compreresti.')
  if (r.q6 === false) agg('q6', -20, 'La spesa esce dal budget libero di questo mese.')
  if (d.tensionePrima >= 7) agg('tensione', -20, 'La tensione nel corpo era alta: ' + d.tensionePrima + ' su 10.')
  else if (d.tensionePrima >= 4) agg('tensione', -10, 'La tensione nel corpo era media: ' + d.tensionePrima + ' su 10.')
  if (d.triggerInterni.length) agg('interni', Math.max(-30, -10 * d.triggerInterni.length), 'Dietro la spinta c’era uno stato emotivo: ' + elenco(d.triggerInterni.map(etichettaInterno)) + '.')
  if (d.triggerEsterni.length) agg('esterni', Math.max(-24, -8 * d.triggerEsterni.length), 'La spinta è arrivata da fuori: ' + elenco(d.triggerEsterni.map(etichettaEsterno)) + '.')
  const g = d.giustificazioni.filter((x) => GIUSTIFICAZIONI.some((y) => y[0] === x))
  if (g.length) agg('giustificazioni', Math.max(-30, -10 * g.length), g.length === 1 ? 'Ti sei detto una frase che serviva a convincerti.' : 'Ti sei detto ' + g.length + ' frasi che servivano a convincerti.')
  if (d.nasconderlo === 'si') agg('nascondere', -25, 'Stavi pensando di non parlarne con ' + PARTNER + '.')
  if (cpu === null) agg('cpu', -10, 'Non prevedi di usarlo: il costo per uso non è calcolabile.')
  else if (cpu > 20) agg('cpu', -10, 'Costo per uso alto: ' + euro(cpu) + ' a utilizzo.')

  const punteggio = Math.max(0, Math.min(100, segnali.reduce((t, s) => t + s.delta, 50)))
  const esito = punteggio < 35 ? 'impulso' : punteggio < 65 ? 'zonaGrigia' : 'necessita'
  const principali = segnali.map((s, i) => ({ s, i })).sort((a, b) => Math.abs(b.s.delta) - Math.abs(a.s.delta) || a.i - b.i).slice(0, 3).map((x) => x.s)
  return { punteggio, esito, segnali, principali, costoPerUso: cpu, oreAttesa: ORE_ATTESA[esito] }
}

/* ---------- stato ------------------------------------------------------ */
const IMPOSTAZIONI_DEFAULT = {
  budgetMensile: 0,
  obiettivoFondo: { nome: '', importo: 0 },
  alternative: Object.assign({}, ALTERNATIVE),
  premi: PREMI.slice(),
  telefonoPartner: '',
  notifiche: false,
}
let S = { sessioni: [], impostazioni: Object.assign({}, IMPOSTAZIONI_DEFAULT) }

const salvaStato = () => Mem.scrivi(S)
const trova = (id) => S.sessioni.find((s) => s.id === id)
const inAttesa = () => S.sessioni.filter((s) => !s.esitoFinale && rimasti(s.scadenzaAttesa) > 0)
const scadute = () => S.sessioni.filter((s) => !s.esitoFinale && rimasti(s.scadenzaAttesa) === 0)
const fondoConsolidato = () => S.sessioni.filter((s) => s.esitoFinale === 'nonComprato').reduce((t, s) => t + s.prezzo, 0)
const fondoPotenziale = () => S.sessioni.filter((s) => !s.esitoFinale).reduce((t, s) => t + s.prezzo, 0)
const tassoRipensamento = () => {
  const chiuse = S.sessioni.filter((s) => s.esitoFinale)
  if (!chiuse.length) return null
  return Math.round((chiuse.filter((s) => s.esitoFinale === 'nonComprato').length / chiuse.length) * 100)
}

/* ---------- impalcatura ------------------------------------------------ */
const radice = document.getElementById('radice')
let pulizia = []
const aPulire = (f) => pulizia.push(f)
const rotta = () => (location.hash || '#/').slice(1)
const vai = (r) => { location.hash = r }

function intestazione() {
  return '<header class="top"><div class="in"><a class="marchio" href="#/">StopShop</a><a class="sos" href="#/sos">SOS</a></div></header>'
}
function azioni(html) { return '<div class="azioni">' + html + '</div>' }
function chip(attivo, dati, testo) {
  return '<button class="chip' + (attivo ? ' on' : '') + '" ' + dati + '><i></i><span>' + testo + '</span></button>'
}

function render() {
  pulizia.forEach((f) => f())
  pulizia = []
  const r = rotta()
  const parti = r.split('/')
  let v
  if (r.startsWith('/pausa')) v = vistaPausa(new URLSearchParams(r.split('?')[1] || '').get('ritest'))
  else if (parti[1] === 'esito') v = vistaEsito(parti[2])
  else if (parti[1] === 'attesa') v = vistaAttesa(parti[2])
  else if (parti[1] === 'qualita') v = vistaQualita(parti[2])
  else if (parti[1] === 'diario') v = vistaDiario()
  else if (parti[1] === 'fondo') v = vistaFondo()
  else if (parti[1] === 'sos') v = vistaSos()
  else if (parti[1] === 'impostazioni') v = vistaImpostazioni()
  else if (parti[1] === 'informazioni') v = vistaInfo()
  else v = vistaHome()

  const scuro = parti[1] === 'sos'
  document.body.classList.toggle('scuro', scuro)
  radice.innerHTML = (scuro ? '' : intestazione()) + v.html
  if (v.dopo) v.dopo()
  window.scrollTo(0, 0)
}

/** Ogni schermata che tocca lo stato lo salva e si ridisegna da qui. */
function aggiorna() { salvaStato(); render() }

/* ---------- home ------------------------------------------------------- */
function vistaHome() {
  const attesa = inAttesa()
  const finite = scadute()
  const tasso = tassoRipensamento()
  const potenziale = fondoPotenziale()

  const pacchi = attesa
    .map((s) => '<a class="pacco" href="#/attesa/' + s.id + '"><span class="t" data-scadenza="' + s.scadenzaAttesa + '">' + countdownBreve(rimasti(s.scadenzaAttesa)) + '</span><span class="l"></span><span class="n">' + esc(s.oggetto) + '</span></a>')
    .join('')

  const nastro = attesa.length
    ? '<div class="nastro"><div class="fila">' + pacchi + pacchi + '</div><div class="rulli"><i></i><i></i></div></div>'
    : '<div class="vuoto"><p>Il nastro è vuoto. Quando rimanderai un acquisto, il pacco comparirà qui e resterà chiuso finché il tempo non sarà passato.</p></div>'

  const scaduteHtml = finite
    .map((s) => '<a href="#/attesa/' + s.id + '" style="display:block;margin-bottom:16px"><div class="card" style="border-color:rgba(168,130,60,.5)"><p class="eyebrow">L’attesa è finita</p><p class="serif mt8" style="font-size:24px;line-height:1.3">Lo vuoi ancora?</p><p class="mono micro mt8">' + esc(s.oggetto) + ' · ' + euro(s.prezzo) + '</p></div></a>')
    .join('')

  return {
    html: '<main>' + scaduteHtml +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px"><span class="eyebrow">In attesa · ' + attesa.length + '</span><a class="micro sotto" href="#/diario">Diario</a></div>' +
      nastro +
      (S.sessioni.length === 0 ? '<p class="sec mt32">' + NOME + ', questa app si apre nel momento esatto in cui stai per comprare. Non serve aprirla prima, e non serve tenerla d’occhio: quando senti la spinta, tocca il pulsante qui sotto.</p>' : '') +
      '<div class="spinta"></div>' +
      '<div class="griglia2 mt40"><a class="bordo-top" href="#/fondo" style="text-decoration:none"><p class="eyebrow">Fondo</p><p class="mono mt8" style="font-size:26px;color:var(--salviascuro)">' + euro(fondoConsolidato()) + '</p>' +
      (potenziale > 0 ? '<p class="mono micro mt8">+ ' + euro(potenziale) + ' in attesa</p>' : '') + '</a>' +
      '<div class="bordo-top"><p class="eyebrow">Ripensamenti</p><p class="mono mt8" style="font-size:26px">' + (tasso === null ? '—' : tasso + '%') + '</p><p class="micro mt8">' + (tasso === null ? 'nessuna attesa conclusa' : 'non li volevi più') + '</p></div></div>' +
      '<div class="mt32" style="display:flex;gap:16px"><a class="micro sotto" href="#/impostazioni">Impostazioni</a><a class="micro sotto" href="#/informazioni">Informazioni</a></div>' +
      azioni('<button class="btn pieno" data-vai="/pausa">Sto per comprare</button>') +
      '</main>',
    dopo() {
      radice.querySelector('[data-vai]').onclick = () => vai('/pausa')
      const fila = radice.querySelector('.fila')
      if (fila && attesa.length) {
        // Otto secondi per larghezza di schermo: il nastro deve sembrare lento.
        const corsa = fila.scrollWidth / 2
        fila.style.setProperty('--corsa', '-' + corsa + 'px')
        fila.style.animationDuration = Math.max(12, (corsa / Math.min(window.innerWidth, 560)) * 8) + 's'
      }
      const t = setInterval(() => {
        radice.querySelectorAll('[data-scadenza]').forEach((el) => {
          el.textContent = countdownBreve(rimasti(el.dataset.scadenza))
        })
        if (scadute().length !== finite.length) render()
      }, 1000)
      aPulire(() => clearInterval(t))
    },
  }
}

/* ---------- pausa: stepper a 7 fasi ------------------------------------ */
const SCHERMATE = [1, 2, 3, 3, 4, 4, 5, 6, 6, 7, 7, 7, 7, 7, 7]
const TITOLI_FASE = ['Ancoraggio', 'L’oggetto', 'Il trigger', 'La tensione', 'Distanziamento', 'Giustificazioni', 'Test di necessità']
const PRIMA_NECESSITA = 9
let P = null

function bozzaVuota() {
  return { oggetto: '', prezzo: '', link: '', categoria: 'altro', usi: 12, triggerEsterni: [], triggerInterni: [], pratiche: [], noteTrigger: '', tensione: 5, conseguenza: null, letto: false, giustificazioni: [], nasconderlo: null, risposte: {} }
}

function alterna(lista, v) { return lista.includes(v) ? lista.filter((x) => x !== v) : lista.concat([v]) }

function vistaPausa(ritest) {
  const prec = ritest ? trova(ritest) : null
  if (!P || P.ritest !== (ritest || null)) {
    P = { i: prec ? PRIMA_NECESSITA : 0, b: bozzaVuota(), ritest: ritest || null, respiro: false }
    if (prec) {
      Object.assign(P.b, {
        oggetto: prec.oggetto, prezzo: String(prec.prezzo), link: prec.link || '', categoria: prec.categoria,
        usi: prec.usiPrevisti12Mesi, triggerEsterni: prec.triggerEsterni, triggerInterni: prec.triggerInterni,
        pratiche: prec.necessitaPratica ? [PRATICHE[0]] : [], noteTrigger: prec.noteTrigger, tensione: prec.tensionePrima,
        letto: true, giustificazioni: prec.giustificazioni, nasconderlo: prec.nasconderlo, risposte: {},
      })
    }
  }
  const b = P.b
  const i = P.i
  const fase = SCHERMATE[i]
  const indiciFase = SCHERMATE.map((f, k) => (f === fase ? k : -1)).filter((k) => k >= 0)
  const avanz = ((fase - 1) / 7) * 100 + (100 / 7) * ((indiciFase.indexOf(i) + 1) / indiciFase.length)

  const puo = (() => {
    if (i === 0) return P.respiro
    if (i === 1) return b.oggetto.trim().length > 0 && Number(b.prezzo) > 0
    if (i === 2) return b.triggerEsterni.length + b.triggerInterni.length + b.pratiche.length > 0
    if (i === 5) return !!b.conseguenza
    if (i === 8) return !!b.nasconderlo
    if (i === 7) return b.giustificazioni.length > 0
    return true
  })()

  let corpo = ''
  let dopoPasso = null

  if (i === 0) {
    corpo = '<p class="dom mt24" style="text-align:center">' + NOME + ', resta qui novanta secondi. L’impulso ha un inizio e una fine naturale: stiamo solo aspettando che smetta di decidere al posto tuo.</p>' +
      '<div class="respiro mt32"><div class="cerchio"></div><p id="fase-respiro">Inspira</p></div><p class="mono micro" style="text-align:center" id="conta">90s</p>'
    dopoPasso = () => {
      const inizio = Date.now()
      const t = setInterval(() => {
        const s = (Date.now() - inizio) / 1000
        const el = document.getElementById('conta')
        if (!el) return
        el.textContent = Math.max(0, Math.ceil(90 - s)) + 's'
        document.getElementById('fase-respiro').textContent = s % 10 < 4 ? 'Inspira' : 'Espira'
        if (s >= 90 && !P.respiro) { P.respiro = true; clearInterval(t); render() }
      }, 250)
      aPulire(() => clearInterval(t))
    }
  }

  if (i === 1) {
    corpo = '<p class="dom mt24">Che cos’è?</p><p class="sec mt12">Nominare l’oggetto è già un modo per separartene.</p>' +
      '<label class="col g8 mt24"><span class="eyebrow">Cosa</span><input class="campo" id="c-oggetto" value="' + esc(b.oggetto) + '" placeholder="Cuffie, giacca, monitor…"></label>' +
      '<div style="display:flex;gap:12px" class="mt12"><label class="col g8" style="flex:1"><span class="eyebrow">Prezzo €</span><input class="campo mono" id="c-prezzo" inputmode="decimal" value="' + esc(b.prezzo) + '" placeholder="0"></label>' +
      '<label class="col g8" style="flex:1"><span class="eyebrow">Categoria</span><select class="campo" id="c-cat">' + CATEGORIE.map((c) => '<option value="' + c[0] + '"' + (b.categoria === c[0] ? ' selected' : '') + '>' + c[1] + '</option>').join('') + '</select></label></div>' +
      '<label class="col g8 mt12"><span class="eyebrow">Link (facoltativo)</span><input class="campo" id="c-link" inputmode="url" value="' + esc(b.link) + '" placeholder="https://"></label>' +
      '<p class="eyebrow mt24">Quante volte pensi di usarlo nei prossimi 12 mesi</p>' +
      '<p class="mono mt8" style="font-size:34px" id="v-usi">' + b.usi + '</p><input type="range" min="0" max="200" value="' + b.usi + '" id="c-usi">' +
      '<div style="display:flex;justify-content:space-between"><span class="micro">mai</span><span class="micro">200 volte</span></div><p class="mono micro mt8" id="v-cpu"></p>'
    dopoPasso = () => {
      const cpu = () => {
        const el = document.getElementById('v-cpu')
        el.textContent = Number(b.prezzo) > 0 && b.usi > 0 ? (Number(b.prezzo) / b.usi).toFixed(2) + ' € per ogni utilizzo' : ''
      }
      const abilita = () => { radice.querySelector('#avanti').disabled = !(b.oggetto.trim() && Number(b.prezzo) > 0) }
      document.getElementById('c-oggetto').oninput = (e) => { b.oggetto = e.target.value; abilita() }
      document.getElementById('c-prezzo').oninput = (e) => { b.prezzo = e.target.value.replace(',', '.'); cpu(); abilita() }
      document.getElementById('c-link').oninput = (e) => { b.link = e.target.value }
      document.getElementById('c-cat').onchange = (e) => { b.categoria = e.target.value }
      document.getElementById('c-usi').oninput = (e) => { b.usi = Number(e.target.value); document.getElementById('v-usi').textContent = b.usi; cpu() }
      cpu()
    }
  }

  if (i === 2) {
    corpo = '<p class="dom mt24">Da dove è arrivata la spinta?</p><p class="sec mt12">Puoi indicarne più di una.</p>' +
      '<p class="eyebrow mt24">Da fuori</p><div class="col g8 mt12">' + TRIGGER_ESTERNI.map((t) => chip(b.triggerEsterni.includes(t[0]), 'data-te="' + t[0] + '"', t[1])).join('') + '</div>' +
      '<p class="eyebrow mt24">Da dentro</p><div class="col g8 mt12">' + TRIGGER_INTERNI.map((t) => chip(b.triggerInterni.includes(t[0]), 'data-ti="' + t[0] + '"', t[1])).join('') + '</div>' +
      '<p class="eyebrow mt24">Necessità pratica</p><div class="col g8 mt12">' + PRATICHE.map((n, k) => chip(b.pratiche.includes(n), 'data-np="' + k + '"', n)).join('') + '</div>'
    dopoPasso = () => {
      radice.querySelectorAll('[data-te]').forEach((el) => (el.onclick = () => { b.triggerEsterni = alterna(b.triggerEsterni, el.dataset.te); render() }))
      radice.querySelectorAll('[data-ti]').forEach((el) => (el.onclick = () => { b.triggerInterni = alterna(b.triggerInterni, el.dataset.ti); render() }))
      radice.querySelectorAll('[data-np]').forEach((el) => (el.onclick = () => { b.pratiche = alterna(b.pratiche, PRATICHE[Number(el.dataset.np)]); render() }))
    }
  }

  if (i === 3) {
    corpo = '<p class="dom mt24">Cosa stavi provando esattamente un istante prima di sentire il bisogno di comprare?</p>' +
      '<textarea class="campo mt24" id="c-note" style="min-height:160px" placeholder="Scrivi come viene. Non serve che abbia senso.">' + esc(b.noteTrigger) + '</textarea>' +
      '<p class="sec mt12">Puoi anche lasciarlo vuoto e andare avanti.</p>'
    dopoPasso = () => { document.getElementById('c-note').oninput = (e) => { b.noteTrigger = e.target.value } }
  }

  if (i === 4) {
    corpo = '<p class="dom mt24">Quanta tensione senti nel corpo, adesso?</p>' +
      '<p class="mono mt32" style="font-size:34px" id="v-tens">' + b.tensione + '</p><input type="range" min="0" max="10" value="' + b.tensione + '" id="c-tens">' +
      '<div style="display:flex;justify-content:space-between"><span class="micro">calmo</span><span class="micro">devo farlo subito</span></div>'
    dopoPasso = () => { document.getElementById('c-tens').oninput = (e) => { b.tensione = Number(e.target.value); document.getElementById('v-tens').textContent = b.tensione } }
  }

  if (i === 5) {
    const o = [['nulla', 'Nulla'], ['fastidio', 'Un piccolo fastidio'], ['problema', 'Un problema concreto']]
    corpo = '<p class="dom mt24">Se non lo comprassi entro stasera, cosa succederebbe davvero?</p><div class="col g8 mt24">' +
      o.map((x) => chip(b.conseguenza === x[0], 'data-cons="' + x[0] + '"', x[1])).join('') + '</div>'
    dopoPasso = () => radice.querySelectorAll('[data-cons]').forEach((el) => (el.onclick = () => { b.conseguenza = el.dataset.cons; render() }))
  }

  if (i === 6) {
    const nome = b.oggetto || 'questo oggetto'
    corpo = '<p class="eyebrow mt24">Leggila ad alta voce</p>' +
      '<p class="serif mt16" style="font-size:22px;line-height:1.4;color:rgba(20,26,31,.5)">Tu hai scritto: «Mi serve ' + esc(nome) + '.»</p>' +
      '<p class="dom mt16">«Ho il pensiero di aver bisogno di ' + esc(nome) + '. Osservo l’impulso a comprarlo.»</p>' +
      (b.letto ? '<p class="sec mt24">Hai appena separato l’io osservante dall’io senziente. Il pensiero è diventato un oggetto che puoi guardare, non un ordine da eseguire.</p>' : '')
  }

  if (i === 7) {
    corpo = '<p class="dom mt24">Quale di queste frasi ti sei detto negli ultimi minuti?</p><div class="col g8 mt16">' +
      GIUSTIFICAZIONI.map((g) => chip(b.giustificazioni.includes(g[0]), 'data-gi="' + g[0] + '"', g[1]) + (b.giustificazioni.includes(g[0]) ? '<p class="controparte">' + g[2] + '</p>' : '')).join('') +
      chip(b.giustificazioni.includes('nessuna'), 'data-gi="nessuna"', 'Nessuna di queste') + '</div>'
    dopoPasso = () => radice.querySelectorAll('[data-gi]').forEach((el) => (el.onclick = () => {
      const id = el.dataset.gi
      b.giustificazioni = id === 'nessuna' ? ['nessuna'] : alterna(b.giustificazioni.filter((x) => x !== 'nessuna'), id)
      render()
    }))
  }

  if (i === 8) {
    const o = [['si', 'Sì'], ['no', 'No'], ['nonCiAvevoPensato', 'Non ci avevo pensato']]
    corpo = '<p class="dom mt24">Stavi pensando di non parlarne con ' + PARTNER + '?</p><div class="col g8 mt24">' +
      o.map((x) => chip(b.nasconderlo === x[0], 'data-nasc="' + x[0] + '"', x[1])).join('') + '</div>' +
      (b.nasconderlo === 'si' ? '<p class="sec mt16">Il bisogno di nascondere un acquisto è uno dei segnali più affidabili che dietro non c’è l’oggetto. Ne teniamo conto, senza farne una colpa.</p>' : '')
    dopoPasso = () => radice.querySelectorAll('[data-nasc]').forEach((el) => (el.onclick = () => { b.nasconderlo = el.dataset.nasc; render() }))
  }

  if (i >= PRIMA_NECESSITA) {
    const d = DOMANDE[i - PRIMA_NECESSITA]
    corpo = '<p class="dom mt24">' + d[1] + '</p>' +
      '<div style="display:flex;gap:12px" class="mt32"><button class="btn linea pieno" data-si>Sì</button><button class="btn linea pieno" data-no>No</button></div>'
    dopoPasso = () => {
      const rispondi = (v) => { b.risposte[d[0]] = v; avantiPausa() }
      radice.querySelector('[data-si]').onclick = () => rispondi(true)
      radice.querySelector('[data-no]').onclick = () => rispondi(false)
    }
  }

  const barraBassa = i >= PRIMA_NECESSITA
    ? (i > PRIMA_NECESSITA || !P.ritest ? '<button class="btn linea" data-indietro>Indietro</button>' : '') + '<span class="micro">Domanda ' + (i - PRIMA_NECESSITA + 1) + ' di 6</span>'
    : (i > 0 ? '<button class="btn linea" data-indietro>Indietro</button>' : '') +
      '<button class="btn pieno" id="avanti"' + (puo ? '' : ' disabled') + '>' + (i === 0 ? (P.respiro ? 'Continua' : 'Resta qui') : i === 6 && !b.letto ? 'L’ho letto' : 'Continua') + '</button>'

  return {
    html: '<main><div class="prog"><i style="width:' + avanz + '%"></i></div>' +
      '<p class="eyebrow mt16">Fase ' + fase + ' · ' + TITOLI_FASE[fase - 1] + '</p>' + corpo +
      '<div class="spinta"></div>' + azioni(barraBassa) + '</main>',
    dopo() {
      if (dopoPasso) dopoPasso()
      const ind = radice.querySelector('[data-indietro]')
      if (ind) ind.onclick = () => { P.i = i - 1; render() }
      const av = radice.querySelector('#avanti')
      if (av) av.onclick = () => { if (i === 6 && !b.letto) { b.letto = true; render() } else avantiPausa() }
    },
  }
}

function avantiPausa() {
  if (P.i < SCHERMATE.length - 1) { P.i += 1; render(); return }
  concludiPausa()
}

function concludiPausa() {
  const b = P.b
  const prec = P.ritest ? trova(P.ritest) : null
  const prezzo = Number(b.prezzo) || 0
  const r = calcolaPunteggio({
    prezzo, usiPrevisti12Mesi: b.usi, triggerEsterni: b.triggerEsterni, triggerInterni: b.triggerInterni,
    necessitaPratica: b.pratiche.length > 0, tensionePrima: b.tensione, giustificazioni: b.giustificazioni,
    nasconderlo: b.nasconderlo || 'no', risposteNecessita: b.risposte,
  })
  const id = prec ? prec.id : nuovoId()
  const sessione = Object.assign({}, prec || {}, {
    id, creataIl: prec ? prec.creataIl : new Date().toISOString(), oggetto: b.oggetto.trim(), prezzo,
    link: b.link.trim() || undefined, categoria: b.categoria, usiPrevisti12Mesi: b.usi,
    triggerEsterni: b.triggerEsterni, triggerInterni: b.triggerInterni, necessitaPratica: b.pratiche.length > 0,
    noteTrigger: b.noteTrigger.trim(), tensionePrima: b.tensione, conseguenzaSeNon: b.conseguenza,
    giustificazioni: b.giustificazioni, nasconderlo: b.nasconderlo || 'no', risposteNecessita: b.risposte,
    punteggio: r.punteggio, esito: r.esito, scadenzaAttesa: fraOre(r.oreAttesa), esitoFinale: undefined,
    alternativaProposta: r.esito === 'impulso' ? (S.impostazioni.alternative[b.triggerInterni[0]] || 'Fai una cosa sola nei prossimi dieci minuti, fuori dallo schermo: cammina, respira, o scrivi cosa è successo.') : undefined,
    compiti: r.esito === 'zonaGrigia' ? COMPITI.map((t) => ({ testo: t, fatto: false })) : undefined,
    ripensamenti: prec ? (prec.ripensamenti || 0) + 1 : 0,
  })
  S.sessioni = [sessione].concat(S.sessioni.filter((s) => s.id !== id))
  P = null
  salvaStato()
  programmaPromemoria(sessione)
  vai('/esito/' + id)
}

/* ---------- esito ------------------------------------------------------ */
function vistaEsito(id) {
  const s = trova(id)
  if (!s) return vistaMancante()
  const r = calcolaPunteggio({
    prezzo: s.prezzo, usiPrevisti12Mesi: s.usiPrevisti12Mesi, triggerEsterni: s.triggerEsterni,
    triggerInterni: s.triggerInterni, necessitaPratica: s.necessitaPratica, tensionePrima: s.tensionePrima,
    giustificazioni: s.giustificazioni, nasconderlo: s.nasconderlo, risposteNecessita: s.risposteNecessita,
  })
  const ore = oreResidue(rimasti(s.scadenzaAttesa))
  const sotto = {
    impulso: 'Il pacco è sul nastro. Ci torniamo fra ' + ore + ' ore, non prima.',
    zonaGrigia: 'Non è ancora chiaro, e va bene così. Fra ' + ore + ' ore lo guardiamo di nuovo, con due informazioni in più.',
    necessita: 'Non ti sto fermando. Ti sto dando il tempo di comprarlo bene: ' + ore + ' ore.',
  }[s.esito]

  let blocco = ''
  if (s.esito === 'impulso') {
    if (s.tensioneDopo !== undefined) {
      const delta = s.tensionePrima - s.tensioneDopo
      blocco = '<div class="card mt32"><p class="eyebrow">Prima e dopo</p><p class="mono mt12" style="font-size:28px">' + s.tensionePrima + ' → ' + s.tensioneDopo + '</p><p class="sec mt8">' +
        (delta > 0 ? 'La tensione è scesa di ' + delta + ' punti senza comprare niente. È il dato più utile che hai su te stesso.' : 'La tensione non è scesa. Succede: vuol dire che quell’azione non era quella giusta per oggi, non che il metodo non funzioni.') + '</p></div>'
    } else {
      blocco = '<div class="card mt32"><p class="eyebrow">Al posto dell’acquisto</p><p class="serif mt12" style="font-size:20px;line-height:1.35">' + esc(s.alternativaProposta) + '</p>' +
        '<div id="zona-azione" class="mt16"></div></div>'
    }
  }
  if (s.esito === 'zonaGrigia') {
    blocco = '<div class="card mt32"><p class="eyebrow">Due cose concrete, prima della scadenza</p>' +
      (s.compiti || []).map((c, k) => '<label style="display:flex;gap:12px;align-items:flex-start;margin-top:12px"><input type="checkbox" data-compito="' + k + '"' + (c.fatto ? ' checked' : '') + ' style="width:20px;height:20px;accent-color:var(--salviascuro);margin-top:3px"><span>' + esc(c.testo) + '</span></label>').join('') + '</div>'
  }
  if (s.esito === 'necessita') {
    blocco = '<div class="card mt32"><p class="serif" style="font-size:20px">La necessità c’è.</p><p class="sec mt8">Adesso il rischio cambia: non è più comprare, è comprare male. Il modulo qui sotto serve a scegliere una volta sola.</p>' +
      '<button class="btn mt16" style="flex:0 0 auto" data-qualita>Apri l’acquisto consapevole</button></div>'
  }

  return {
    html: '<main><p class="eyebrow mt32">Verdetto</p><h1 class="verdetto mt12">' + TITOLI[s.esito] + '</h1><p class="sec mt16">' + sotto + '</p>' +
      '<p class="eyebrow mt32">Cosa ha pesato di più</p><div class="col g12 mt12">' +
      r.principali.map((x) => '<div class="segnale"><i class="' + (x.delta > 0 ? 'piu' : '') + '"></i><span>' + x.testo + '</span></div>').join('') + '</div>' +
      '<p class="mono micro mt24">' + esc(s.oggetto) + ' · ' + euro(s.prezzo) + ' · indice ' + s.punteggio + '/100</p><p class="micro">L’indice misura questa decisione, non te.</p>' +
      blocco +
      (s.esito !== 'necessita' ? '<p class="micro mt32">' + euro(s.prezzo) + ' sono entrati nel Fondo come risparmio potenziale. Diventano tuoi davvero solo se, a tempo scaduto, non lo vorrai più.</p>' : '') +
      '<div class="spinta"></div>' +
      azioni('<button class="btn linea" data-home>Torna al nastro</button><a class="micro sotto" href="#/attesa/' + s.id + '">Vedi l’attesa</a>') + '</main>',
    dopo() {
      radice.querySelector('[data-home]').onclick = () => vai('/')
      const q = radice.querySelector('[data-qualita]')
      if (q) q.onclick = () => vai('/qualita/' + s.id)
      radice.querySelectorAll('[data-compito]').forEach((el) => (el.onchange = () => {
        s.compiti[Number(el.dataset.compito)].fatto = el.checked
        salvaStato()
      }))
      const zona = document.getElementById('zona-azione')
      if (zona) azioneAlternativa(zona, s)
    },
  }
}

/** §6: una sola alternativa, con l'attrezzo giusto per il trigger dichiarato. */
function azioneAlternativa(zona, s) {
  const trigger = s.triggerInterni[0]
  let stato = 'proposta'
  let tensione = s.tensionePrima
  const tel = S.impostazioni.telefonoPartner

  function disegna() {
    if (stato === 'proposta') {
      let extra = ''
      if (trigger === 'ansia') extra = '<button class="btn" style="flex:0 0 auto" data-avvia>Guidami</button>'
      else if (trigger === 'rabbia') extra = '<button class="btn" style="flex:0 0 auto" data-avvia>Scrivi qui</button>'
      else if (trigger === 'premio') extra = '<button class="btn" style="flex:0 0 auto" data-avvia>Apri la lista</button>'
      else if ((trigger === 'tristezza' || trigger === 'solitudine') && tel) extra = '<a class="btn" style="flex:0 0 auto" href="tel:' + esc(tel) + '">Chiama ' + PARTNER + '</a>'
      zona.innerHTML = '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">' + extra +
        '<button class="' + (extra ? 'micro sotto' : 'btn linea') + '" data-fatto>L’ho fatto</button></div>'
      const a = zona.querySelector('[data-avvia]')
      if (a) a.onclick = () => { stato = 'corso'; disegna() }
      zona.querySelector('[data-fatto]').onclick = () => { stato = 'dopo'; disegna() }
      return
    }
    if (stato === 'corso' && trigger === 'ansia') {
      let tappa = 0
      const mostra = () => {
        zona.innerHTML = '<div style="background:var(--inchiostro);color:var(--nebbia);padding:24px 20px;border-radius:2px">' +
          '<p class="eyebrow" style="color:rgba(230,233,228,.4)">' + (tappa + 1) + ' di ' + BODY_SCAN.length + '</p>' +
          '<p class="serif mt16" style="font-size:22px;line-height:1.4;min-height:96px">' + BODY_SCAN[tappa] + '</p>' +
          '<button class="btn chiaro mt24" style="flex:0 0 auto" data-fine>Ho finito</button></div>'
        zona.querySelector('[data-fine]').onclick = () => { clearInterval(t); stato = 'dopo'; disegna() }
      }
      const t = setInterval(() => {
        if (tappa < BODY_SCAN.length - 1) { tappa += 1; mostra() } else { clearInterval(t); stato = 'dopo'; disegna() }
      }, 30000)
      aPulire(() => clearInterval(t))
      mostra()
      return
    }
    if (stato === 'corso' && trigger === 'rabbia') {
      // Lo sfogo non viene mai salvato: vive qui dentro e sparisce con la schermata.
      zona.innerHTML = '<textarea class="campo" style="min-height:180px" placeholder="Senza filtri."></textarea>' +
        '<p class="micro mt8">Questo testo non viene salvato da nessuna parte: sparisce quando chiudi la schermata.</p>' +
        '<button class="btn mt16" style="flex:0 0 auto" data-fine>Ho finito</button>'
      zona.querySelector('[data-fine]').onclick = () => { stato = 'dopo'; disegna() }
      return
    }
    if (stato === 'corso' && trigger === 'premio') {
      zona.innerHTML = '<div class="col g8">' + (S.impostazioni.premi.length
        ? S.impostazioni.premi.map((p) => '<div style="border:1px solid rgba(20,26,31,.1);padding:12px 16px;border-radius:2px">' + esc(p) + '</div>').join('')
        : '<p class="micro">La lista è vuota. Puoi scriverla in impostazioni, con calma, quando non sei sotto spinta.</p>') + '</div>' +
        '<button class="btn mt16" style="flex:0 0 auto" data-fine>Scelto</button>'
      zona.querySelector('[data-fine]').onclick = () => { stato = 'dopo'; disegna() }
      return
    }
    zona.innerHTML = '<p class="serif" style="font-size:22px">Com’è adesso la tensione?</p>' +
      '<p class="mono mt16" style="font-size:34px" id="v-td">' + tensione + '</p><input type="range" min="0" max="10" value="' + tensione + '" id="c-td">' +
      '<div style="display:flex;justify-content:space-between"><span class="micro">calmo</span><span class="micro">devo farlo subito</span></div>' +
      '<button class="btn mt16" style="flex:0 0 auto" data-salva>Salva</button>'
    zona.querySelector('#c-td').oninput = (e) => { tensione = Number(e.target.value); zona.querySelector('#v-td').textContent = tensione }
    zona.querySelector('[data-salva]').onclick = () => { s.tensioneDopo = tensione; s.alternativaFatta = true; aggiorna() }
  }
  disegna()
}

/* ---------- attesa ----------------------------------------------------- */
function vistaAttesa(id) {
  const s = trova(id)
  if (!s) return vistaMancante()
  const finita = rimasti(s.scadenzaAttesa) === 0
  const chiusa = !!s.esitoFinale
  const chiudi = (esitoFinale) => { s.esitoFinale = esitoFinale; salvaStato(); annullaPromemoria(s.id); vai('/') }

  return {
    html: '<main><p class="eyebrow mt32">' + (chiusa ? 'Chiusa' : finita ? 'Attesa finita' : 'In attesa') + '</p>' +
      '<h1 class="serif mt12" style="font-size:34px;line-height:1.25">' + esc(s.oggetto) + '</h1>' +
      (!finita && !chiusa ? '<p class="mono mt32" style="font-size:44px;line-height:1;color:var(--ottone)" id="conto">' + countdown(rimasti(s.scadenzaAttesa)) + '</p>' : '') +
      (finita && !chiusa ? '<div class="mt32"><p class="verdetto">Lo vuoi ancora?</p><p class="sec mt12">Rispondi con quello che senti adesso, non con quello che sentivi allora. Le due cose quasi mai coincidono: è tutto il senso dell’attesa.</p>' +
        '<div class="col g12 mt24"><button class="btn" data-no>Non lo voglio più</button><button class="btn linea" style="flex:1" data-si>Lo voglio ancora</button></div>' +
        '<p class="micro mt12">Se lo vuoi ancora, rifacciamo solo il test di necessità: sei domande, meno di un minuto.</p></div>' : '') +
      '<div class="card mt32"><div class="riga"><span class="micro">Verdetto</span><span class="mono">' + TITOLI[s.esito].replace('.', '') + '</span></div>' +
      '<div class="riga"><span class="micro">Prezzo</span><span class="mono">' + euro(s.prezzo) + '</span></div>' +
      '<div class="riga"><span class="micro">Indice</span><span class="mono">' + s.punteggio + '/100</span></div>' +
      '<div class="riga"><span class="micro">Aperta il</span><span class="mono">' + dataOra(s.creataIl) + '</span></div>' +
      '<div class="riga"><span class="micro">Scadenza</span><span class="mono">' + dataOra(s.scadenzaAttesa) + '</span></div>' +
      (s.ripensamenti ? '<div class="riga"><span class="micro">Riaperture</span><span class="mono">' + s.ripensamenti + '</span></div>' : '') + '</div>' +
      (s.esito === 'necessita' && !chiusa ? '<button class="btn linea mt24" style="flex:0 0 auto" data-qualita>Apri l’acquisto consapevole</button>' : '') +
      (chiusa ? '<p class="sec mt24">' + (s.esitoFinale === 'nonComprato' ? 'Non comprato. Il prezzo è passato nel Fondo.' : s.esitoFinale === 'compratoMeglio' ? 'Comprato, dopo il modulo di qualità. È il modo giusto di chiudere una necessità reale.' : 'Comprato. Registrato senza commenti: serve solo a rendere il quadro vero.') + '</p>' : '') +
      '<div class="spinta"></div>' +
      (!chiusa ? '<button class="micro sotto mt32" data-comprato>L’ho comprato lo stesso</button>' : '') +
      azioni('<button class="btn linea" data-home>Torna al nastro</button><a class="micro sotto" href="#/sos">Ho bisogno di aiuto adesso</a>') + '</main>',
    dopo() {
      radice.querySelector('[data-home]').onclick = () => vai('/')
      const q = radice.querySelector('[data-qualita]')
      if (q) q.onclick = () => vai('/qualita/' + s.id)
      const no = radice.querySelector('[data-no]')
      if (no) no.onclick = () => chiudi('nonComprato')
      const si = radice.querySelector('[data-si]')
      if (si) si.onclick = () => { P = null; vai('/pausa?ritest=' + s.id) }
      const c = radice.querySelector('[data-comprato]')
      if (c) c.onclick = () => chiudi('comprato')
      const conto = document.getElementById('conto')
      if (conto) {
        const t = setInterval(() => {
          const ms = rimasti(s.scadenzaAttesa)
          conto.textContent = countdown(ms)
          if (ms === 0) render()
        }, 1000)
        aPulire(() => clearInterval(t))
      }
    },
  }
}

/* ---------- qualità ---------------------------------------------------- */
function vistaQualita(id) {
  const s = trova(id)
  if (!s) return vistaMancante()
  if (!s.qualita) {
    s.qualita = { vitaUtileAnni: 5, criteri: {}, apertaIl: new Date().toISOString(), alternative: [
      { id: 'a', nome: '', prezzo: 0, note: '' }, { id: 'b', nome: '', prezzo: 0, note: '' },
      { id: 'c', nome: '', prezzo: 0, note: '' }, { id: 'usato', nome: 'Usato o ricondizionato', prezzo: 0, note: '', usato: true }] }
    salvaStato()
  }
  const q = s.qualita
  const compilati = Object.values(q.criteri).filter((c) => c.voto > 0 || (c.note || '').trim()).length
  const scadenza = new Date(new Date(q.apertaIl).getTime() + 24 * ORA_MS).toISOString()
  const tempoPassato = rimasti(scadenza) === 0
  const sbloccato = tempoPassato && compilati >= 6
  const usiTotali = Math.max(1, s.usiPrevisti12Mesi * q.vitaUtileAnni)
  const voce = (k) => q.criteri[k] || { voto: 0, note: '' }

  return {
    html: '<main><p class="eyebrow mt32">Acquisto consapevole</p>' +
      '<h1 class="serif mt12" style="font-size:28px;line-height:1.3">La necessità c’è. Adesso il rischio cambia: non è più comprare, è comprare male.</h1>' +
      (tempoPassato && !s.esitoFinale ? '<div class="card mt32" style="border-color:rgba(95,122,107,.5)"><p class="serif" style="font-size:24px;line-height:1.3">A mente fredda, lo vuoi ancora, e lo vuoi ancora così?</p><button class="btn linea mt16" style="flex:0 0 auto" data-lascio>No, lascio perdere</button></div>' : '') +
      '<div class="card mt24"><p class="eyebrow">Prezzo massimo</p><p class="sec mt8">Scrivilo <em>prima</em> di aprire i siti. È l’unico numero che non è stato scelto da chi vende.</p>' +
      '<div style="display:flex;gap:12px" class="mt12"><label style="flex:1"><span class="eyebrow">Il tuo tetto €</span><input class="campo mono mt8" inputmode="decimal" id="q-max" value="' + (q.prezzoMassimo || '') + '"></label>' +
      '<label style="flex:1"><span class="eyebrow">Prezzo reale €</span><input class="campo mono mt8" inputmode="decimal" id="q-reale" value="' + (q.prezzoReale || '') + '"></label></div>' +
      (q.prezzoMassimo && q.prezzoReale ? '<p class="micro mt12" style="color:' + (q.prezzoReale > q.prezzoMassimo ? 'var(--bracescuro)' : 'var(--salviascuro)') + '">' +
        (q.prezzoReale > q.prezzoMassimo ? 'Sopra il tetto di ' + euro(q.prezzoReale - q.prezzoMassimo) + '. Non è un divieto: è un’informazione che avevi già dato a te stesso.' : 'Dentro il tetto che ti eri dato.') + '</p>' : '') + '</div>' +
      '<div class="card mt12"><p class="eyebrow">Vita utile stimata</p><div style="display:flex;gap:12px;align-items:center" class="mt12"><input class="campo mono" style="width:96px" type="number" min="1" max="30" id="q-vita" value="' + q.vitaUtileAnni + '"><span class="micro">anni</span></div>' +
      '<p class="mono micro mt12">' + euro((q.prezzoReale || s.prezzo) / usiTotali) + ' per ogni utilizzo, su ' + usiTotali + ' usi stimati.</p></div>' +
      '<p class="eyebrow mt32">Otto criteri</p><div class="col g12 mt12">' +
      CRITERI.map((c) => '<div class="card"><p class="serif" style="font-size:19px">' + c[1] + '</p><p class="micro mt8">' + c[2] + '</p>' +
        '<div class="voti mt12">' + [1, 2, 3, 4, 5].map((v) => '<button class="' + (voce(c[0]).voto >= v ? 'on' : '') + '" data-voto="' + c[0] + '" data-v="' + v + '">' + v + '</button>').join('') + '</div>' +
        '<textarea class="campo mt12" style="min-height:64px;font-size:13px" placeholder="Cosa hai verificato" data-nota="' + c[0] + '">' + esc(voce(c[0]).note) + '</textarea></div>').join('') + '</div>' +
      '<p class="eyebrow mt32">Confronto</p><p class="sec mt8">Tre alternative, più l’usato: va guardato sempre, anche quando sembra fuori discussione.</p><div class="col g12 mt12">' +
      q.alternative.map((a) => '<div class="card"' + (a.usato ? ' style="border-color:rgba(168,130,60,.4)"' : '') + '><div style="display:flex;gap:12px"><input class="campo" placeholder="' + (a.usato ? 'Usato o ricondizionato' : 'Modello') + '" data-alt="' + a.id + '" data-campo="nome" value="' + esc(a.nome) + '"><input class="campo mono" style="width:110px" inputmode="decimal" placeholder="€" data-alt="' + a.id + '" data-campo="prezzo" value="' + (a.prezzo || '') + '"></div>' +
        '<input class="campo mt8" style="font-size:13px" placeholder="Nota: garanzia, ricambi, fonte della recensione" data-alt="' + a.id + '" data-campo="note" value="' + esc(a.note) + '">' +
        (a.prezzo > 0 ? '<p class="mono micro mt8">' + (a.prezzo / usiTotali).toFixed(2) + ' € per uso</p>' : '') + '</div>').join('') + '</div>' +
      '<div class="card mt32"><p class="eyebrow">Sblocco</p><div class="riga"><span class="micro">Tempo</span><span class="mono" id="q-tempo">' + (tempoPassato ? 'passato' : countdown(rimasti(scadenza))) + '</span></div>' +
      '<div class="riga"><span class="micro">Criteri compilati</span><span class="mono">' + compilati + '/6</span></div>' +
      (s.esitoFinale ? '<p class="sec mt16">Questa decisione è chiusa.</p>' : '<button class="btn mt16" id="q-pronto"' + (sbloccato ? '' : ' disabled') + '>Sono pronto a comprarlo</button>') + '</div>' +
      '<div class="spinta"></div>' +
      azioni('<button class="btn linea" data-home>Torna al nastro</button><a class="micro sotto" href="#/attesa/' + s.id + '">Vedi l’attesa</a>') + '</main>',
    dopo() {
      radice.querySelector('[data-home]').onclick = () => vai('/')
      const lascio = radice.querySelector('[data-lascio]')
      if (lascio) lascio.onclick = () => { s.esitoFinale = 'nonComprato'; salvaStato(); vai('/') }
      const num = (v) => (v === '' ? undefined : Number(String(v).replace(',', '.')))
      radice.querySelector('#q-max').oninput = (e) => { q.prezzoMassimo = num(e.target.value); salvaStato() }
      radice.querySelector('#q-reale').oninput = (e) => { q.prezzoReale = num(e.target.value); salvaStato() }
      radice.querySelector('#q-vita').oninput = (e) => { q.vitaUtileAnni = Math.max(1, Number(e.target.value) || 1); salvaStato() }
      radice.querySelectorAll('[data-voto]').forEach((el) => (el.onclick = () => {
        const k = el.dataset.voto
        q.criteri[k] = Object.assign({ voto: 0, note: '' }, q.criteri[k], { voto: Number(el.dataset.v) })
        aggiorna()
      }))
      radice.querySelectorAll('[data-nota]').forEach((el) => (el.oninput = () => {
        const k = el.dataset.nota
        q.criteri[k] = Object.assign({ voto: 0, note: '' }, q.criteri[k], { note: el.value })
        salvaStato()
      }))
      radice.querySelectorAll('[data-alt]').forEach((el) => (el.oninput = () => {
        const a = q.alternative.find((x) => x.id === el.dataset.alt)
        a[el.dataset.campo] = el.dataset.campo === 'prezzo' ? Number(el.value.replace(',', '.')) || 0 : el.value
        salvaStato()
      }))
      const pronto = radice.querySelector('#q-pronto')
      if (pronto) pronto.onclick = () => {
        pronto.outerHTML = '<div><p class="serif" style="font-size:20px">Confermi?</p><div style="display:flex;gap:12px" class="mt12"><button class="btn" id="q-si">Sì, lo compro</button><button class="btn linea" id="q-aspetto">Aspetto ancora</button></div></div>'
        radice.querySelector('#q-si').onclick = () => { s.esitoFinale = 'compratoMeglio'; salvaStato(); vai('/diario') }
        radice.querySelector('#q-aspetto').onclick = () => render()
      }
      const tempo = document.getElementById('q-tempo')
      if (tempo && !tempoPassato) {
        const t = setInterval(() => {
          const ms = rimasti(scadenza)
          tempo.textContent = ms === 0 ? 'passato' : countdown(ms)
          if (ms === 0) render()
        }, 1000)
        aPulire(() => clearInterval(t))
      }
    },
  }
}

/* ---------- diario ----------------------------------------------------- */
function grafico(titolo, dati, colora) {
  if (!dati.length) return ''
  const max = Math.max.apply(null, dati.map((d) => d[1]))
  return '<p class="eyebrow mt32">' + titolo + '</p><div class="barre mt12">' +
    dati.map((d) => '<div class="' + (colora && d[2] ? 'salvia' : '') + '" title="' + d[1] + '"><i style="height:' + (max ? (d[1] / max) * 100 : 0) + '%"></i></div>').join('') + '</div>' +
    '<div class="assex">' + dati.map((d) => '<span>' + esc(d[0]) + '</span>').join('') + '</div>'
}

function vistaDiario() {
  if (!S.sessioni.length) {
    return { html: '<main><p class="eyebrow mt32">Diario</p><p class="dom mt12">Ancora niente da leggere.</p><p class="sec mt16">Dopo qualche pausa, qui compaiono gli orari in cui la spinta arriva più spesso e gli stati che se la portano dietro. È la parte che serve davvero: i pattern non si ricordano, si misurano.</p></main>' }
  }
  const tasso = tassoRipensamento()
  const fasce = Array.from({ length: 8 }, (_, k) => [due(k * 3) + '–' + due(k * 3 + 3), 0])
  S.sessioni.forEach((s) => { fasce[Math.floor(new Date(s.creataIl).getHours() / 3)][1] += 1 })

  const conta = new Map()
  S.sessioni.forEach((s) => {
    s.triggerInterni.forEach((t) => conta.set(t, (conta.get(t) || 0) + 1))
    s.triggerEsterni.forEach((t) => conta.set(t, (conta.get(t) || 0) + 1))
  })
  const trigger = [...conta.entries()].map(([id, n]) => [
    (TRIGGER_INTERNI.find((t) => t[0] === id) || TRIGGER_ESTERNI.find((t) => t[0] === id) || [, id])[1].split(' ')[0], n,
    TRIGGER_INTERNI.some((t) => t[0] === id)]).sort((a, b) => b[1] - a[1]).slice(0, 6)

  const cat = new Map()
  S.sessioni.forEach((s) => cat.set(s.categoria, (cat.get(s.categoria) || 0) + 1))
  const categorie = [...cat.entries()].map(([id, n]) => [(CATEGORIE.find((c) => c[0] === id) || [, id])[1], n]).sort((a, b) => b[1] - a[1])

  const somma = new Map()
  S.sessioni.forEach((s) => s.triggerInterni.forEach((t) => {
    const v = somma.get(t) || [0, 0]
    somma.set(t, [v[0] + s.tensionePrima, v[1] + 1])
  }))
  const tensioni = [...somma.entries()].map(([id, v]) => [(TRIGGER_INTERNI.find((t) => t[0] === id) || [, id])[1], Number((v[0] / v[1]).toFixed(1))]).sort((a, b) => b[1] - a[1])

  return {
    html: '<main><p class="eyebrow mt32">Diario</p>' +
      '<div class="bordo-top mt16"><p class="eyebrow">Tasso di ripensamento</p><p class="mono mt8" style="font-size:52px;line-height:1;color:var(--salviascuro)">' + (tasso === null ? '—' : tasso + '%') + '</p>' +
      '<p class="sec mt8">' + (tasso === null ? 'Nessuna attesa ancora conclusa.' : 'Degli oggetti arrivati a scadenza, questa è la quota che non hai più voluto. È la prova che l’attesa fa il lavoro al posto della forza di volontà.') + '</p></div>' +
      grafico('Quando arriva la spinta', fasce) + grafico('Trigger più frequenti', trigger, true) +
      grafico('Categorie più colpite', categorie) + grafico('Tensione media per trigger', tensioni) +
      '<p class="eyebrow mt32">Storico</p><div class="col g8 mt12">' +
      S.sessioni.map((s) => '<a href="#/attesa/' + s.id + '" style="text-decoration:none"><div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline"><span class="serif" style="font-size:19px">' + esc(s.oggetto) + '</span><span class="mono micro">' + euro(s.prezzo) + '</span></div>' +
        '<p class="micro mt8">' + dataOra(s.creataIl) + ' · ' + TITOLI[s.esito].replace('.', '') + (s.esitoFinale ? ' · ' + { nonComprato: 'non comprato', compratoMeglio: 'comprato meglio', comprato: 'comprato' }[s.esitoFinale] : '') + '</p>' +
        (s.tensioneDopo !== undefined ? '<p class="mono micro" style="color:var(--salviascuro)">tensione ' + s.tensionePrima + ' → ' + s.tensioneDopo + '</p>' : '') + '</div></a>').join('') +
      '</div></main>',
  }
}

/* ==========================================================================
   Parte PWA: service worker, promemoria di fine attesa, installazione.
   Attiva solo quando la pagina è servita da un indirizzo http/https; aperta
   come file locale l'app funziona lo stesso, senza notifiche e senza
   installazione (il service worker richiede un contesto sicuro).
   ========================================================================== */

let eventoInstallazione = null

const contestoSicuro = () => location.protocol === 'https:' || location.hostname === 'localhost'
const notificheSupportate = () => 'Notification' in window && 'serviceWorker' in navigator && contestoSicuro()
const installata = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true
const installabile = () => !!eventoInstallazione && !installata()

async function avviaInstallazione() {
  if (!eventoInstallazione) return
  await eventoInstallazione.prompt()
  await eventoInstallazione.userChoice
  eventoInstallazione = null
  render()
}

async function chiediPermessoNotifiche() {
  if (!notificheSupportate()) return 'denied'
  if (Notification.permission === 'default') await Notification.requestPermission()
  if (Notification.permission === 'granted') attivaSincronizzazionePeriodica()
  return Notification.permission
}

async function messaggioAlWorker(messaggio) {
  if (!('serviceWorker' in navigator) || !contestoSicuro()) return
  const reg = await navigator.serviceWorker.ready
  const destinazione = reg.active || navigator.serviceWorker.controller
  if (destinazione) destinazione.postMessage(messaggio)
}

/**
 * Il testo della notifica non crea urgenza: dice che il tempo è passato e
 * apre l'attesa. Nessun countdown, nessuna offerta, nessun "stai per perdere".
 */
function vocePromemoria(s) {
  return {
    id: s.id,
    quando: new Date(s.scadenzaAttesa).getTime(),
    titolo: 'L’attesa è finita',
    corpo: s.oggetto + ': a mente fredda, lo vuoi ancora?',
    url: new URL('#/attesa/' + s.id, location.href).href,
  }
}

function programmaPromemoria(s) {
  if (!S.impostazioni.notifiche || Notification.permission !== 'granted') return
  if (new Date(s.scadenzaAttesa).getTime() <= Date.now()) return
  messaggioAlWorker({ tipo: 'programma-attesa', attesa: vocePromemoria(s) })
}

function annullaPromemoria(id) {
  messaggioAlWorker({ tipo: 'annulla-attesa', id })
}

/** All'avvio: si riallinea l'elenco nel worker e si recupera ciò che è scaduto. */
function riallineaPromemoria() {
  if (!S.impostazioni.notifiche || !notificheSupportate() || Notification.permission !== 'granted') return
  messaggioAlWorker({ tipo: 'sincronizza-attese', attese: inAttesa().map(vocePromemoria) })
  messaggioAlWorker({ tipo: 'controlla-attese' })
}

/** Android, ad app installata: il sistema risveglia il worker ogni tanto. */
async function attivaSincronizzazionePeriodica() {
  try {
    const reg = await navigator.serviceWorker.ready
    if (!reg.periodicSync) return
    const stato = await navigator.permissions.query({ name: 'periodic-background-sync' })
    if (stato.state !== 'granted') return
    await reg.periodicSync.register('controllo-attese', { minInterval: 60 * 60 * 1000 })
  } catch (e) {}
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault()
  eventoInstallazione = e
  if (rotta().indexOf('/impostazioni') === 0) render()
})
window.addEventListener('appinstalled', () => { eventoInstallazione = null })

if ('serviceWorker' in navigator && contestoSicuro()) {
  navigator.serviceWorker
    .register('./sw.js')
    .then(() => navigator.serviceWorker.ready)
    .then(() => riallineaPromemoria())
    .catch(() => {})
}
